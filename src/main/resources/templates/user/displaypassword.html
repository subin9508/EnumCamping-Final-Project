<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link th:href="@{/css/header.css}" rel="stylesheet" />
<link th:href="@{/css/footer.css}" rel="stylesheet" />
<th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
<style>
.container {
	background: #fff;
	padding: 2rem;
	border-radius: 0.5rem;
	box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
	text-align: center;
}

.btn-custom {
	margin-top: 1rem;
}
</style>
</head>
<body>
	<div class="wrapper">
		<th:block th:replace="~{/layout/fragments :: header}"></th:block>
		<div class="footer-main-content">
			<div class="card mt-5 text-center"
				style="width: 30rem; margin: auto; border-color: black; border-radius: 0;">
				<h2 class="card-header"
					style="text-align: center; border: none; background-color: white;">
					비밀번호 찾기 결과</h2>
				<div class="card-body mt-3">
					<p>
						귀하의 임시 비밀번호는 <strong th:text="${tempPassword}"></strong> 입니다.
					</p>
				</div>
				<div class="mb-3">
					<a th:href="@{/user/signin}" class="btn btn-outline-success">로그인</a>
				</div>
			</div>
		</div>
		<th:block th:replace="~{/layout/fragments :: footer}"></th:block>
	</div>
	<!-- 부트 스트랩 JS -->
	<th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>

	<!-- Weather JS -->
	<th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>
</body>
</html>
