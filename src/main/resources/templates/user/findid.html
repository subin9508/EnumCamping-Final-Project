<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
    <link th:href="@{/css/header.css}" rel="stylesheet" />
    <link th:href="@{/css/footer.css}" rel="stylesheet" />
    <title>Find ID</title>
    <style>
        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }

        .form-label {
            font-weight: bold;
        }

        .btn-custom {
            background-color: #007bff;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }

        .result-container {
            margin-top: 1rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <th:block th:replace="~{/layout/fragments :: header}"></th:block>
        <div class="footer-main-content">
            <div class="card mt-5" style="width: 30rem; margin: auto;  border-color: black; border-radius: 0; ">
                <div class="card-header" style="text-align:center; border:none 1px; background-color:white;">
                    <h2 class="mt-2">아이디 찾기</h2>
                </div>
                <div class="card-body">
                    <form class="form-horizontal" role="form" method="POST" th:action="@{/user/findid}">
                        <div class="mb-3">
                            <label for="user_name" class="form-label">이름</label>
                            <input type="text" name="user_name" class="form-control" id="user_name" placeholder="이름" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="user_email" class="form-label">이메일</label>
                            <input type="email" name="user_email" class="form-control" id="user_email" placeholder="이메일" required>
                        </div>
                        <button type="submit" class="btn btn-success" style="float: right;" id="submitBtn" disabled>찾기</button>
                        <a th:href="@{/user/signin}" class="btn btn-outline-primary">로그인</a>
                    </form>
                </div>
                <div id="messageContainer" class="mt-3">
                    <div th:if="${not #strings.isEmpty(message)}" class="alert alert-danger" th:text="${message}"></div>
                </div>
            </div>
        </div>
       <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
	</div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var submitBtn = document.getElementById("submitBtn");
            var nameInput = document.getElementById("user_name");
            var emailInput = document.getElementById("user_email");

            function validateInputs() {
                if (nameInput.value.trim() !== "" && emailInput.value.trim() !== "") {
                    submitBtn.disabled = false;
                } else {
                    submitBtn.disabled = true;
                }
            }

            nameInput.addEventListener("input", validateInputs);
            emailInput.addEventListener("input", validateInputs);
        });
    </script>
	<!-- 부트 스트랩 JS -->
        <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>
        
        <!-- Weather JS -->
        <th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>
</body>
</html>
