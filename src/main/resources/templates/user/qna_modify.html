<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/mypage_qna_modify.css}">
</head>
<body>
<div class="modify-wrapper">
     <th:block th:replace="~{/layout/fragments :: header}"></th:block>
    <div class="footer-main-content qna-content">
        <div th:replace="fragments/mypage-sidebar :: sidebar"></div>
        <div class="container-fluid">
            <main>
                <div class="qna-modify-container">
                    <h2 class="qna-title">문의내역 수정</h2>
                    <form id="modifyForm" method="post" th:action="@{/user/qna_update}">
                        <div class="mb-3">
                            <label for="qnaPostId" class="form-label">번호</label>
                            <input id="qnaPostId" class="form-control" type="text" name="qnaPostId" 
                                   th:value="${qnaDetails.qnaPostId}" readonly/>
                        </div>
                        <div class="mb-3">
                            <label for="qnaTitle" class="form-label">제목</label>
                            <input id="qnaTitle" class="form-control" type="text" name="qnaTitle" 
                                   th:value="${qnaDetails.qnaTitle}"/>
                        </div>
                        <div class="mb-3">
                            <label for="qnaContent" class="form-label">내용</label>
                            <textarea id="qnaContent" class="form-control" name="qnaContent" rows="5"
                                      th:text="${qnaDetails.qnaContent}"></textarea>
                        </div>
                        <input id="qnaUserId" type="hidden" name="qnaUserId" th:value="${qnaDetails.qnaUserId}"/>
                        <input type="hidden" name="userId" th:value="${user.userId}"/>
                    </form>
                    <div th:if="${signedInUser == qnaDetails.qnaUserId}">
                        <div class="card-footer text-end">
                            <button type="submit" form="modifyForm" class="btn btn-outline-success btnUpdate">업데이트</button>
                            <a class="btn btn-outline-danger btnDelete" th:href="@{/user/qna_delete(qnaPostId=${qnaDetails.qnaPostId}, userId=${user.userId})}">삭제하기</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
</div>

<!-- 부트 스트랩 JS -->
        <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>
        
        <!-- Weather JS -->
        <th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modifyForm = document.querySelector('form#modifyForm');
        const inputQnATitle = document.querySelector('input#qnaTitle');
        const textQnAContent = document.querySelector('textarea#qnaContent');
        const btnDelete = document.querySelector('.btnDelete');
        const btnUpdate = document.querySelector('.btnUpdate');
        
        btnDelete.addEventListener('click', (e) => {
            const result = confirm('정말 삭제할까요?');
            if (!result) {
                e.preventDefault();
            }
        });

        btnUpdate.addEventListener('click', (e) => {
            e.preventDefault();
            if (inputQnATitle.value === '' || textQnAContent.value === '') {
                alert('제목과 내용은 반드시 입력하세요.');
                return;
            }

            const result = confirm('변경 내용을 저장할까요?');
            if (result) {
                modifyForm.submit();
            }
        });
    });
</script>

</body>
</html>
