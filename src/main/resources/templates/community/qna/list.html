<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
<link rel="stylesheet" th:href="@{/css/header.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/mypage_qna_list.css}">
<!-- Bootstrap CSS -->
<link
    href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css"
    rel="stylesheet">
    
<style>
.status-waiting {
	color: red !important;
}

.status-completed {
	color: blue !important;
}

.secret-icon {
	width: 16px;
	height: 16px;
	margin-left: 5px;
	vertical-align: middle;
}

ul.pagination {
	display: flex;
	justify-content: center;
	list-style-type: none; /* 순서 없는 리스트 스타일 제거 */
	padding: 0;
}
.pagination .page-link {
            color: #000000; /* 기본 글자색 검정 */
        }

.pagination .page-link:hover {
	background-color: #7C9C63; /* 호버 시 배경색 초록 */
	color: #fff; /* 호버 시 글자색 흰색 */
}

.pagination .page-item.active .page-link {
	background-color: #7C9C63; /* 활성화된 페이지 배경색 초록 */
	border-color: #7C9C63; /* 활성화된 페이지 테두리 색상 초록 */
	color: #fff; /* 활성화된 페이지 글자색 흰색 */
}

.btnSearch, .btnList, .btnCreate {
    border-radius: 5px;
    border-color: #7C9C63;
    background-color: #fff;
    color: #7C9C63;
}

.btnSearch:hover, .btnList:hover, .btnCreate:hover{
    background-color: #708b58; /* hover 상태에서 약간 밝은 색상으로 변경 */
    border-color: #708b58;
    color: white;
}

/* 반응형 스타일 */
        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column; /* 작은 화면에서는 세로로 배치 */
            }

            .sidebar {
                width: 100%; /* 사이드바가 전체 너비를 차지 */
                max-width: 100%;
                margin-bottom: 20px; /* 메인 콘텐츠와 간격을 유지 */
                margin-right: 20px; 
            }

            .main-content {
                margin-left: 0; /* 작은 화면에서는 여백 제거 */
                width: 100%; /* 메인 콘텐츠가 전체 너비를 차지 */
            }

            .qna-list-container {
                margin-top: 20px; /* 작은 화면에서 여백 추가 */
            }
            
            .search-form {
                flex-direction: column; /* 검색 폼을 세로로 배치 */
            }

            .search-form .form-control {
                margin-bottom: 10px; /* 요소 사이에 여백 추가 */
                width: 100%;
            }

            .search-form .btnSearch, .search-form .btnList {
                width: 100%; /* 버튼 너비를 100%로 설정 */ 
            }
        }
  
</style>
    
</head>
<body>
    <div class="wrapper">
        <!-- 상단 메뉴바 -->
        <th:block th:replace="~{/layout/fragments :: header}"></th:block>

        <div class="footer-main-content qna-content">
        	
            <th:block th:replace="~{/layout/fragments :: community-sidebar}"></th:block>
            
            <main class="col-md-9 ms-sm-auto col-lg-11 px-md-3">
                <div class="qna-list-container mt-10 card" style="width: 85%" >
                    <div class="card-header" style="background-color: white;">
                        <h1 class="qna-title align-center mt-2"style="color:#7C9C63; border-bottom: 2px solid #7C9C63;">QnA</h1>
                        
                        <form th:action="@{/community/qna/search}" action="${qnaSearchPage}">
                            <div class="row">
                                <div class="col-2">
                                    <select class="form-control" name="category">
                                        <option value="t">제목</option>
                                        <option value="c">내용</option>
                                        <option value="tc">제목+내용</option>
                                        <option value="a">작성자</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <input class="form-control"
                                        type="text" name="keyword"
                                        placeholder="검색어 입력" required />
                                </div>
                                <div class="col-2">
                                    <input type="submit"
                                        class="form-control btn btnSearch"
                                        value="검색" />
                                </div>
                                <div class="col-2">
                                    <button type="button"
                                        class="form-control btn btnList"
                                        th:onclick="|location.href='@{/community/qna/list}'|">전체
                                        목록</button>
                                </div>
                            </div>
                        </form>

                    </div>
                    <div class="card-body">
                    <!-- 알림 메시지 표시 -->
                    <div th:if="${message}" class="alert alert-warning" role="alert" th:text="${message}"></div>
                        <table class="table table-hover">
                            <thead>
                                <tr style="text-align: center;">
                                    <th>번호</th>
                                    <th>제목</th>
                                    <th>작성자</th>
                                    <th>수정시간</th>
                                    <th>답변상태</th>
                                    <th>조회수</th>
                                </tr>
                            </thead>
							<tbody>
                                    <tr th:each="qna : ${qnas}" style="cursor:pointer; text-align: center;"
                                        th:onclick="|location.href='@{/community/qna/details(id=${qna.id})}'|">
                                        <td class="col-1" th:text="${qna.id}"></td>
                                        <td class="col-3">
                                            <a th:href="@{/community/qna/details(id=${qna.id})}">
                                                <span th:text="${qna.title}"></span>
                                                <img th:if="${qna.qnaLock == 1}" th:src="@{/images/community/secret.png}" class="secret-icon" alt="비밀글">
                                            </a>
                                        </td>
                                        <td class="col-2" th:text="${qna.author}"></td>
                                        <td class="col-2" th:text="${#temporals.format(qna.modifiedTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                        <td th:class="${qna.qnaState == 0 ? 'status-waiting col-2' : 'status-completed col-2'}">
                                            <span th:text="${qna.qnaState == 0 ? '답변 대기' : '답변 완료'}"></span>
                                        </td>
                                        <td class="col-1" th:text="${qna.qnaViewCnt}"></td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(qnas)}">
                                        <td colspan="6" style="text-align: center;">검색 결과가 없습니다.</td>
                                    </tr>
                            </tbody>
                        </table>
                        
                         <a style="text-align: left">총 게시글 수: <span th:text="${totalCount}"></span> 개</a>
                            <div class="text-end">
                                <a class="btn btnCreate" th:href="@{/community/qna/create}" style="text-align: right">글작성</a>
                            </div>
                            <div>
                                <nav aria-label="Page navigation example" th:if="${totalPages != null and totalPages > 0}">
                                    <ul class="pagination">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" 
                                            	th:href="@{|${baseUrl}?p=${currentPage != null && currentPage > 0 ? currentPage - 1 : 0}&category=${category}&keyword=${keyword}|}" 
                                            	aria-label="Previous">
                                                <span aria-hidden="true">&laquo;</span>
                                            </a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                            th:classappend="${currentPage != null && currentPage == i} ? 'active'">
                                            <a class="page-link" 
                                            	th:href="@{|${baseUrl}?p=${i}&category=${category}&keyword=${keyword}|}" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                                            <a class="page-link" th:href="@{|${baseUrl}?p=${currentPage != null && currentPage + 1 < totalPages ? currentPage + 1 : currentPage}&category=${category}&keyword=${keyword}|}" aria-label="Next">
                                                <span aria-hidden="true">&raquo;</span>
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        
                        
                    </div>

                    <div
                        class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                        <button type="button"
                            onclick="location.href ='create'"
                            class="btn btn-outline-primary"
                            th:if="${userRole == 0}">글 작성</button>
                    </div>

                </div>

            </main>
            </div>
        <!-- 푸터 -->
        <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
    </div>
    
    <!-- 부트 스트랩 JS -->
    <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>
    
    <!-- Weather JS -->
    <th:block th:fragment="~{/layout/fragments :: weatherJS}"></th:block>

</body>
</html>
