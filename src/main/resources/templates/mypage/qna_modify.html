<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
<link rel="stylesheet" th:href="@{/css/header.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/mypage_qna_modify.css}">
<!-- Bootstrap CSS -->
<link
    href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>

    <div class="wrapper">
        <!-- 상단 메뉴바 -->
        <th:block th:replace="~{/layout/fragments :: header}"></th:block>

        <div class="footer-main-content">
            <th:block th:replace="~{/layout/fragments :: mypage-sidebar}"></th:block>
			<div class="modify-container-fluid">
            <main>
            <div class="qna-modify-container">
                <div class="card">
                    <h2 class="not-title">문의내역 수정</h2>

                    <form id="modifyForm" method="post" th:action="@{/mypage/update}">
                        <div class="mb-3">
                            <label for="id" class="form-label">번호</label>
                            <input id="id" class="form-control"
                                type="text" name="id"
                                th:value="${qna.id}" readonly />
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">제목</label>
                            <input id="title" class="form-control"
                                type="text" name="title"
                                th:value="${qna.title}" />
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">내용</label>
                            <textarea id="content" class="form-control"
                                name="content" rows="5" th:text="${qna.content}"></textarea>
                        </div>
                        <!-- 비밀글 체크박스 -->
						<div class="mb-3 form-check">
							<input class="form-check-input" type="checkbox" id="qnaLock"
								name="qnaLock" value="1" th:checked="${qna.qnaLock == 1}">
							<label class="form-check-label" for="qnaLock">비밀글로 설정</label>
						</div>                        
                        <div class="mb-3 d-none">
                            <label for="userId" class="form-label">작성자</label>
                            <input id="userId" class="form-control"
                                type="text" name="userId"
                                th:value="${qna.qnaUserId}" />
                        </div>
                    </form>

						<div class="card-footer">
							<div class="mt-2 d-flex justify-content-end">
								<button class="mx-2 btn btn-outline-danger" id="btnDelete">삭제</button>
								<button class="btn btn-outline-primary" id="btnUpdate">업데이트</button>
							</div>
						</div>

					</div>
					</div>
            </main>
            </div>
        </div>
        <!-- 푸터 -->
        <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
    </div>
    
    <script th:src="@{/js/qna_delete.js}"></script>
    <script th:src="@{/js/qna_modify.js}"></script>

    <!-- 부트 스트랩 JS -->
    <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>

    <!-- Weather JS -->
    <th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>

</body>
</html>
