<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/footer.css}" rel="stylesheet">
    <link th:href="@{/css/sidebar.css}" rel="stylesheet" />
    <link th:href="@{/css/notice_list.css}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- Header fragment inclusion -->
         <th:block th:replace="~{/layout/fragments :: header}"></th:block>
        <div class="footer-main-content">
            <th:block th:replace="~{/layout/fragments :: mypage-sidebar}"></th:block>
            <main>
                <div class="card">
                	<div class="card-header" style="background-color: white;">
							<h2 class="text-center">상세 예약 내역</h2>
					</div>
					<div class="card-body">
                    <form>
                        <input id="resId" name="resId" type="hidden" th:value="${resMaster.resId}">
                        <input id="userId" name="userId" type="hidden" th:value="${resMaster.user.userId}">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="resCheckIn" class="form-label">체크인 날짜</label>
                                    <input id="resCheckIn" class="form-control" type="text" th:value="${resMaster.resCheckIn}" readonly>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="resCheckOut" class="form-label">체크아웃 날짜</label>
                                    <input id="resCheckOut" class="form-control" type="text" th:value="${resMaster.resCheckOut}" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="resArea" class="form-label">예약 구역, 금액</label>
                            <th:block th:each="item : ${resDetail}">
                                <th:block th:if="${1 <= item.itemId && item.itemId <= 4}">
                                    <input readonly class="form-control" type="text" name="resArea" th:value="'캠핑존 A-1, ' + ${item.itemAmount} + '원'">
                                </th:block>
                                <th:block th:if="${5 <= item.itemId && item.itemId <= 8}">
                                    <input readonly class="form-control" type="text" name="resArea" th:value="'캠핑존 A-2, ' + ${item.itemAmount} + '원'">
                                </th:block>
                                <th:block th:if="${9 <= item.itemId && item.itemId <= 12}">
                                    <input readonly class="form-control" type="text" name="resArea" th:value="'캠핑존 B-1, ' + ${item.itemAmount} + '원'">
                                </th:block>
                                <th:block th:if="${13 <= item.itemId && item.itemId <= 16}">
                                    <input readonly class="form-control" type="text" name="resArea" th:value="'캠핑존 B-2, ' + ${item.itemAmount} + '원'">
                                </th:block>
                                <th:block th:if="${17 <= item.itemId && item.itemId <= 20}">
                                    <input readonly class="form-control" type="text" name="resArea" th:value="'캠핑존 C, ' + ${item.itemAmount} + '원'">
                                </th:block>
                            </th:block>
                        </div>
                        <div class="mt-2">
                            <!-- 구매/대여 물품 리스트 -->
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th scope="col">물품 이름</th>
                                        <th scope="col">물품 수량</th>
                                        <th scope="col">물품 가격</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="rs : ${resDetail}" th:if="${rs.itemId > 20}">
                                        <td th:text="${rs.itemName}"></td>
                                        <td th:text="${rs.itemQuantity}"></td>
                                        <td th:text="${rs.itemAmount} + '원'"></td>
                                    </tr>
                                    <tr th:if="${#lists.size(resDetail) eq 1}">
                                        <td colspan="3" class="text-center">선택하신 구매/대여물품이 없습니다.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-2 total-price">
                            <label for="resTotalPrice" class="form-label fs-5" style="color: #0056b3;">총 가격</label>
                            <input id="resTotalPrice" class="form-control fs-5" type="text" th:value="${resMaster.resTotalPrice} + '원'" style="color: #0056b3;" readonly />
                        </div>
                        <div class="mt-2">
                            <label for="requirement" class="form-label">요청사항</label>
                            <textarea id="requirement" class="form-control" rows="5" readonly th:text="${#strings.isEmpty(resMaster.requirement) ? '요청없음' : resMaster.requirement}"></textarea>
                        </div>
                        <div class="mt-2">
                            <label for="resCreatedTime" class="form-label">예약 일시</label>
                            <input id="resCreatedTime" class="form-control" type="text" th:value="*{#temporals.format(resMaster.resCreatedTime,'yyyy-MM-dd HH:mm:ss')}" readonly />
                        </div>
                        <div class="mt-2">
                            <label for="resState" class="form-label">예약 상태</label>

                            <input id="resState" class="form-control" type="text" th:value="${resMaster.resState == 0 ? '예약대기' : (resMaster.resState == 1 ? '예약완료' : (resMaster.resState == 2 ? '예약취소' : (resMaster.resState == 3 ? '예약변경완료' : '알 수 없음')))}" readonly 
                            	th:style="${resMaster.resState == 0 ? 'color: green;' : (resMaster.resState == 1 ? 'color: blue;' : (resMaster.resState == 2 ? 'color: red;' : (resMaster.resState == 3 ? 'color: #FF1493;' : 'color: black;')))}" />

                        </div>
                    </form>
                </div>

                    <!-- 예약 완료 상태일 때만 취소 버튼 보여줌 -->
                    <div class="card-footer" th:if="${resMaster.resState == 1}" style="background-color: white; display: flex;">
                        <button id="btnPayCancel" class="btn btn-danger">예약취소</button>
                        <a class="btn btn-success" th:onclick="|location.href='@{/mypage/reservation_update(resId=${resMaster.resId})}'|" style="margin-left: auto;">예약변경</a>
                    </div>
               </div>
            </main>
        </div>
        <!-- Footer fragment inclusion -->
        <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
    </div>

   <!-- 부트 스트랩 JS -->
        <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>
        
        <!-- Weather JS -->
        <th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://cdn.iamport.kr/js/iamport.payment-1.2.0.js"></script>

    <script th:src="@{/js/payment.js}"></script>
    <script th:src="@{/js/paymentCancel.js}"></script>
</body>
</html>
