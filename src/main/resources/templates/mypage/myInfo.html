<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
<link th:href="@{/css/myInfo.css}" rel="stylesheet" />
<link th:href="@{/css/header.css}" rel="stylesheet" />
<link th:href="@{/css/footer.css}" rel="stylesheet" />
<link th:href="@{/css/sidebar.css}" rel="stylesheet" />

<!-- Bootstrap CSS -->
<link
	href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css"
	rel="stylesheet">



<style>
.btn-outline-success {
	border: 1px solid green;
	background-color: white;
	color: green;
	padding: 0.375rem 0.75rem;
	font-size: 1rem;
	border-radius: 0.25rem;
	cursor: pointer;
	text-align: center;
}

.btn-outline-success:hover {
	background-color: green;
	color: white;
}

.btn-link-custom {
	text-decoration: none;
	color: green;
}

.btn-link-custom:hover {
	color: white;
}

.wrapper {
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

.content {
	flex: 1;
}

footer {
	margin-top: auto;
}
</style>
</head>
<body>
	<div class="wrapper">
		<th:block th:replace="~{/layout/fragments :: header}"></th:block>
		<div class="container-fluid content">
			<main>
				<div class="row">
					<div class="col-md-3 mypage-sidebar">
						<th:block th:replace="~{/layout/fragments :: mypage-sidebar}"></th:block>
					</div>
					<div class="col-md-9 main-content">
						<div class="card card-reservation mt-2">
							<div class="card-reservation-header">내 정보</div>
							<div class="card-reservation-body text-center">
								<form id="updateForm" method="post"
									th:action="@{/mypage/user_update}">

									<!-- 기존 코드 위치에 추가 -->
									<div class="mb-3 row">
										<label class="col-sm-2 col-form-label">프로필 이미지</label>
										<div class="col-sm-10">
											<img
												th:if="${user.profile != null and user.profile.profileImageUrl != null}"
												th:src="@{/profile/{imageFileName}(imageFileName=${user.profile.profileImageUrl})}"
												alt="프로필 이미지" class="img-thumbnail"
												style="max-width: 200px;">
											<p
												th:if="${user.profile == null or user.profile.profileImageUrl == null}">프로필
												이미지가 없습니다.</p>
										</div>
									</div>


									<div class="mb-3 row">
										<label for="userName" class="col-sm-2 col-form-label">이름</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" id="userName"
												name="userName" th:value="${user.name}" readonly>
										</div>
									</div>
									<div class="mb-3 row">
										<label for="userId" class="col-sm-2 col-form-label">아이디</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" id="userId"
												name="userId" th:value="${user.userId}" readonly>
										</div>
									</div>
									<div class="mb-3 row d-none">
										<label for="userPassword" class="col-sm-2 col-form-label">비밀번호</label>
										<div class="col-sm-10">
											<!-- 비밀번호 필드는 표시하지 않음 -->
											<input type="password" class="form-control" id="userPassword"
												name="userPassword" placeholder="비밀번호 변경 시 입력" readonly>
										</div>
									</div>
									<div class="mb-3 row">
										<label for="userEmail" class="col-sm-2 col-form-label">이메일</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" id="userEmail"
												name="userEmail" th:value="${user.userEmail}" readonly>
										</div>
									</div>
									<div class="mb-3 row">
										<label for="userPhone" class="col-sm-2 col-form-label">전화번호</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" id="userPhone"
												name="userPhone" th:value="${user.userPhone}" readonly>
										</div>
									</div>
								</form>
								<div class="mb-3 row">
									<div class="col-sm-8 offset-sm-2">
										<a th:href="@{/mypage/password_check}"
											class="btn btn-outline-success btn-link-custom">정보 수정하기</a>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</main>
		</div>

		<th:block th:replace="~{/layout/fragments :: footer}"></th:block>
	</div>
	<script src="https://code.jquery.com/jquery-1.12.4.min.js"
		type="text/javascript"></script>
	<script th:inline="javascript">
		var contextPath = /*[[@{/}]]*/'';
	</script>
	<!-- 부트 스트랩 JS -->
	<th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>

	<!-- Weather JS -->
	<th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>
</body>
</html>
