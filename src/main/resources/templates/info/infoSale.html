<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{layout/fragments :: documentHeader}"></th:block>
<link rel="stylesheet" th:href="@{/css/header.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/infoModal.css}">
<!-- Bootstrap CSS -->
<link
    href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- 상단 메뉴바 -->
        <th:block th:replace="~{layout/fragments :: header}"></th:block>

        <div class="footer-main-content">
            <th:block th:replace="~{layout/fragments :: info-sidebar}"></th:block>
            <main class="main-content " style="margin-left: 300px; margin-top: 50px;">
                <div class="content-1">
                    <br>
                    <h1>
                        <strong>[판매 물품 목록]</strong>
                    </h1>
                    <br>
                    <div class="content-2" style="margin-right: 35px;">
                    <div class="row">        
                        <div class="col-lg-4 col-md-6 col-sm-12">
                        <div class="facilities-card">
                            <h5>바베큐세트</h5>
                            <div class="fc-img-container">
                                <img alt="bbqset" th:src="@{/images/info/bbqset.png}" class="img"
                                    height=400px width=500px id="bbqImage" />
                            </div>
                        </div>
                        </div>
                        <div class="col-lg-4 col-md-6 col-sm-12">
                        <div class="facilities-card">
                            <h5>고구마</h5>
                            <div class="fc-img-container">
                                <img alt="sweetpotato" th:src="@{/images/info/sweetpotato.png}" class="img"
                                    height=400px width=500px id="sweetImage" />
                            </div>
                        </div>
                        </div>
                        <div class="col-lg-4 col-md-6 col-sm-12">
                        <div class="fc-facilities-card">
                            <h5>마시멜로우</h5>
                            <div class="fc-img-container">
                                <img alt="marshmallow" th:src="@{/images/info/marshmallow.png}" class="img"
                                    height=400px width=500px id="marshImage" />
                            </div>
                        </div>
                        </div>
                        <div class="col-lg-4 col-md-6 col-sm-12">
                        <div class="facilities-card">
                            <h5>장작</h5>
                            <div class="fc-img-container">
                                <img alt="firewood" th:src="@{/images/info/firewood.png}"
                                    class="img" height=400px width=500px
                                    id="firewoodImage" />
                            </div>
                        </div>
                        </div>
                        <div class="col-lg-4 col-md-6 col-sm-12">
                        <div class="facilities-card">
                            <h5>부탄가스</h5>
                            <div class="fc-img-container">
                                <img alt="butangas" th:src="@{/images/info/butangas.png}" class="img"
                                    height=400px width=500px id="butangasImage" />
                            </div>
                        </div>
                        </div>
                        <div class="col-lg-4 col-md-6 col-sm-12">
                        <div class="facilities-card">
                            <h5>오로라가루</h5>
                            <div class="fc-img-container">
                            <img alt="aurorapowder" th:src="@{/images/info/aurorapowder.png}" class="img"
                                height=400px width=500px id="aurorapowderImage" />
                            </div>
                        </div>
                        </div>
                    </div>
                </div>

    

    <!-- Modal Structure -->
    <div class="modal" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">물품 판매 리스트</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item" data-title="바베큐 세트">
                                <img th:src="@{/images/info/bbqset.png}" class="d-block w-100" style="width: 500px; height: 400px; object-fit: cover;" alt="Sink">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2" >
                                <h5 style="color: black;">35,000원</h5>
                                <p style="color: gray;">삼겹살(200g)+소세지+채소+장작+집게+불판</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="고구마">
                                <img th:src="@{/images/info/sweetpotato.png}" class="d-block w-100" style="width: 500px; height: 400px; object-fit: cover;" alt="Shower">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">5,000원</h5>
                                <p style="color: gray;">꿀 고구마(200g)</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="마시멜로우">
                                <img th:src="@{/images/info/marshmallow.png}" class="d-block w-100" style="width: 500px; height: 400px; object-fit: cover;" alt="Toilet">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">6,000원</h5>
                                <p style="color: gray;">1봉지(10개입) + 꼬치 5개</p>
                            </div>
                            </div>
                            
                            <div class="carousel-item active" data-title="장작">
                                <img th:src="@{/images/info/firewood.png}" class="d-block w-100" style="width: 500px; height: 400px; object-fit: cover;" alt="Barbecue">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">11,000원</h5>
                                <p style="color: gray;">10kg</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="부탄가스">
                                <img th:src="@{/images/info/butangas.png}" class="d-block w-100" style="width: 500px; height: 400px; object-fit: cover;" alt="Pool">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">2,000원</h5>
                                <p style="color: gray;">1개</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="오로라가루">
                                <img th:src="@{/images/info/aurorapowder.png}" class="d-block w-100" style="width: 500px; height: 400px; object-fit: cover;" alt="Store">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">1,500원</h5>
                                <p style="color: gray;">1개</p>
                            </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </div>
    </main>
        </div>
        <!-- 푸터 -->
        <th:block th:replace="~{layout/fragments :: footer}"></th:block>
    </div>
    
    <script th:src="@{/js/infoRental.js}"></script>
   
    <!-- 부트 스트랩 JS -->
    <th:block th:replace="~{layout/fragments :: bootstrapJS}"></th:block>

	<script>
document.addEventListener('DOMContentLoaded', (event) => {
    const images = document.querySelectorAll('.img');
    
    images.forEach((image, index) => {
        image.addEventListener('click', (event) => {
            const imgIndex = index;
            const carouselElement = document.getElementById('carouselExampleControls');
            const carousel = new bootstrap.Carousel(carouselElement);

            // 먼저 Carousel을 해당 인덱스로 이동
            carousel.to(imgIndex);

            // 슬라이드 이동 후에 제목을 업데이트
            carouselElement.addEventListener('slid.bs.carousel', function onSlide(e) {
                const activeItem = carouselElement.querySelector('.carousel-item.active');
                const newTitle = activeItem.getAttribute('data-title');
                document.getElementById('modalTitle').textContent = newTitle;

                // 이벤트 리스너 중복 등록 방지
                carouselElement.removeEventListener('slid.bs.carousel', onSlide);
            });

            // 이후 모달을 표시
            const modal = new bootstrap.Modal(document.getElementById('imageModal'));
            modal.show();
        });
    });

    // Carousel의 슬라이드가 변경될 때 제목을 업데이트
    const carouselElement = document.getElementById('carouselExampleControls');
    carouselElement.addEventListener('slide.bs.carousel', function (e) {
        const activeItem = e.relatedTarget;
        const newTitle = activeItem.getAttribute('data-title');
        document.getElementById('modalTitle').textContent = newTitle;
    });
});

</script>

	<!-- Weather JS -->
    <th:block th:replace="~{layout/fragments :: weatherJS}"></th:block>

</body>
</html>
