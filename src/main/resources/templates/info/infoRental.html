<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
        
        <link rel="stylesheet" th:href="@{/css/header.css}">
        <link rel="stylesheet" th:href="@{/css/footer.css}">
        <link rel="stylesheet" th:href="@{/css/sidebar.css}">
        <link rel="stylesheet" th:href="@{/css/infoModal.css}">
        <!-- Bootstrap CSS -->
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">

    
    </head>
	<body>
	<div class="wrapper">
        <!-- 상단 메뉴바 -->
        <th:block th:replace="~{/layout/fragments :: header}"></th:block>
        
        <div class="footer-main-content not-content">
        <!--  사이드바 -->
        <th:block th:replace="~{/layout/fragments :: info-sidebar}"></th:block>
            
        <main class="main-content col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="content-1 text-left mt-5"> 
          		<br>
                <h1>
                	<strong>[대여 물품 목록]</strong>
                </h1>
            </div>
            
            <div class="content-2" style="margin-right: 35px;">
        <div class="facilities-section">        
            
            <div class="facilities-card">
                <h5>그리들&버너세트</h5>
                <div class="img-container">
					<img th:src="@{/images/info/burnerset.png}" alt="burnerset" class="img" 
					id="barbecueImage" />
                </div>
            </div>
            <div class="facilities-card">
                <h5>랜턴</h5>
                <div class="img-container">
					<img th:src="@{/images/info/lantern.jpg}" alt="lantern" class="img" 
					 id="lanternImage" />
                </div>
            </div>
            <div class="facilities-card">
                <h5>전기릴선</h5>
                <div class="img-container">
                    <img th:src="@{/images/info/electricreelwire.png}" alt="electric reel" 
                    class="img" id="reelImage" />
                </div>

            </div>


        <div class="facilities-section">
            <div class="facilities-card">
                <h5>10L난로</h5>
                <div class="img-container">
					<img th:src="@{/images/info/fireplace.png}" alt="fireplace" class="img" 
					 id="fireplaceImage" />

                </div>
            </div>
            <div class="facilities-card">
                <h5>전기장판</h5>
                <div class="img-container">
                    <img th:src="@{/images/info/electricblanket.png}" 
                    alt="electric blanket" class="img"  id="blanketImage" />
                </div>
            </div>
            <div class="facilities-card">
                <h5>캠핑의자</h5>
                <div class="img-container">
                <img th:src="@{/images/info/chair.png}" alt="camping chair" 
                class="img"  id="chairImage" />
                </div>
            </div>
        </div>
    </div>
    </div>

   
    <!-- Modal Structure -->
    <div class="modal" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">물품 대여 리스트</h5>
                </div>
                <div class="modal-body">
                    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item" data-title="그리들&버너 세트">
                                <img th:src="@{/images/info/burnerset.png}" alt="burner set">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2" >
                                <h5 style="color: black;">15,000원</h5>
                                <p style="color: gray;">이소가스 미포함</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="랜턴">
                                <img th:src="@{/images/info/lantern.jpg}" alt="lantern">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">3,500원</h5>
                                <p style="color: gray;">다양한 랜턴 보유</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="전기릴선">
                                <img th:src="@{/images/info/electricreelwire.png}" alt="electric reel">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">3,000원</h5>
                                <p style="color: gray;">20m</p>
                            </div>
                            </div>
                            
                            <div class="carousel-item active" data-title="10L 난로">
                                <img th:src="@{/images/info/fireplace.png}" alt="fireplace">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">20,000원</h5>
                                <p style="color: gray;">기름 미포함</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="전기장판">
                                <img th:src="@{/images/info/electricblanket.png}"  alt="electric blanket">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">4,000원</h5>
                                <p style="color: gray;">1인용</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="캠핑 의자">
                                <img th:src="@{/images/info/chair.png}" alt="camping chair">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">5,000원</h5>
                                <p style="color: gray;">다양한 캠핑의자 보유</p>
                            </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        </div>
                        
            </main>
        </div>
		<!-- 푸터 -->
        <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
        </div>
        
        <!-- 부트 스트랩 JS -->
        <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>
    
        <!-- Weather JS -->
        <th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>
        
        <!-- infoRental JS -->
        <script th:src="@{/js/infoRental.js}"></script>
				
</body>
</html>
