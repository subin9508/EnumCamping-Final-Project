<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
        
        <link rel="stylesheet" th:href="@{/css/header.css}">
        <link rel="stylesheet" th:href="@{/css/footer.css}">
        <link rel="stylesheet" th:href="@{/css/sidebar.css}">
        <link rel="stylesheet" th:href="@{/css/infoModal.css}">
        <!-- Bootstrap CSS -->
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">

    
    </head>
	<body>
	<div class="wrapper">
        <!-- 상단 메뉴바 -->
        <th:block th:replace="~{/layout/fragments :: header}"></th:block>
        
        <div class="footer-main-content">
        <!--  사이드바 -->
        <th:block th:replace="~{/layout/fragments :: info-sidebar}"></th:block>
            
        <main class="main-content" style="margin-left: 300px; margin-top: 50px;">
            <div class="content-1 text-left mt-5"> 
          		<br>
                <h1>
                	<strong>[대여 물품 목록]</strong>
                </h1>
            </div>
            
            <div class="content-2" style="margin-right: 35px;">
        <div class="row">        
            <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="facilities-card">
                <h5>그리들&버너세트</h5>
                <div class="fc-img-container">
					<img th:src="@{/images/info/burnerset.png}" alt="burnerset" class="img" 
					id="barbecueImage" />
                </div>
            </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="facilities-card">
                <h5>랜턴</h5>
                <div class="fc-img-container">
					<img th:src="@{/images/info/lantern.jpg}" alt="lantern" class="img" 
					 id="lanternImage" />
                </div>
            </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="facilities-card">
                <h5>전기릴선</h5>
                <div class="fc-img-container">
                    <img th:src="@{/images/info/electricreelwire.png}" alt="electric reel" 
                    class="img" id="reelImage" />
                </div>
            </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="facilities-card">
                <h5>10L난로</h5>
                <div class="fc-img-container">
					<img th:src="@{/images/info/fireplace.png}" alt="fireplace" class="img" 
					 id="fireplaceImage" />

                </div>
            </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="facilities-card">
                <h5>전기장판</h5>
                <div class="fc-img-container">
                    <img th:src="@{/images/info/electricblanket.png}" 
                    alt="electric blanket" class="img"  id="blanketImage" />
                </div>
            </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="facilities-card">
                <h5>캠핑의자</h5>
                <div class="fc-img-container">
                <img th:src="@{/images/info/chair.png}" alt="camping chair" 
                class="img"  id="chairImage" />
                </div>
            </div>
            </div>
        </div>
    </div>

   
    <!-- Modal Structure -->
    <div class="modal" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">물품 대여 리스트</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item" data-title="그리들&버너 세트">
                                <img th:src="@{/images/info/burnerset.png}" style="width: 500px; height: 400px; object-fit: cover;" alt="burner set" class="d-block w-100">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2" >
                                <h5 style="color: black;">15,000원</h5>
                                <p style="color: gray;">이소가스 미포함</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="랜턴">
                                <img th:src="@{/images/info/lantern.jpg}" style="width: 500px; height: 400px; object-fit: cover;" alt="lantern" class="d-block w-100">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">3,500원</h5>
                                <p style="color: gray;">다양한 랜턴 보유</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="전기릴선">
                                <img th:src="@{/images/info/electricreelwire.png}" style="width: 500px; height: 400px; object-fit: cover;" alt="electric reel" class="d-block w-100">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">3,000원</h5>
                                <p style="color: gray;">20m</p>
                            </div>
                            </div>
                            
                            <div class="carousel-item active" data-title="10L 난로">
                                <img th:src="@{/images/info/fireplace.png}" style="width: 500px; height: 400px; object-fit: cover;" alt="fireplace" class="d-block w-100">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">20,000원</h5>
                                <p style="color: gray;">기름 미포함</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="전기장판">
                                <img th:src="@{/images/info/electricblanket.png}" style="width: 500px; height: 400px; object-fit: cover;" alt="electric blanket" class="d-block w-100">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">4,000원</h5>
                                <p style="color: gray;">1인용</p>
                            </div>
                            </div>
                            <div class="carousel-item" data-title="캠핑 의자">
                                <img th:src="@{/images/info/chair.png}" style="width: 500px; height: 400px; object-fit: cover;" alt="camping chair" class="d-block w-100">
                                <div class="modal-footer d-flex flex-column align-items-center mt-2">
                                <h5 style="color: black;">5,000원</h5>
                                <p style="color: gray;">다양한 캠핑의자 보유</p>
                            </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        </div>
                        
            </main>
        </div>
		<!-- 푸터 -->
        <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
        </div>
        
        <!-- 부트 스트랩 JS -->
        <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>
    
        <script>
document.addEventListener('DOMContentLoaded', (event) => {
    const images = document.querySelectorAll('.img');
    
    images.forEach((image, index) => {
        image.addEventListener('click', (event) => {
            const imgIndex = index;
            const carouselElement = document.getElementById('carouselExampleControls');
            const carousel = new bootstrap.Carousel(carouselElement);

            // 먼저 Carousel을 해당 인덱스로 이동
            carousel.to(imgIndex);

            // 슬라이드 이동 후에 제목을 업데이트
            carouselElement.addEventListener('slid.bs.carousel', function onSlide(e) {
                const activeItem = carouselElement.querySelector('.carousel-item.active');
                const newTitle = activeItem.getAttribute('data-title');
                document.getElementById('modalTitle').textContent = newTitle;

                // 이벤트 리스너 중복 등록 방지
                carouselElement.removeEventListener('slid.bs.carousel', onSlide);
            });

            // 이후 모달을 표시
            const modal = new bootstrap.Modal(document.getElementById('imageModal'));
            modal.show();
        });
    });

    // Carousel의 슬라이드가 변경될 때 제목을 업데이트
    const carouselElement = document.getElementById('carouselExampleControls');
    carouselElement.addEventListener('slide.bs.carousel', function (e) {
        const activeItem = e.relatedTarget;
        const newTitle = activeItem.getAttribute('data-title');
        document.getElementById('modalTitle').textContent = newTitle;
    });
});

</script>
    
        <!-- Weather JS -->
        <th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>
        
</body>
</html>
