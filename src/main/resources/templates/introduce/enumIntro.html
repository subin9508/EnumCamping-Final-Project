<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{/layout/fragments :: documentHeader}"></th:block>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/introduce.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <th:block th:replace="~{/layout/fragments :: header}"></th:block>
        
        <div class="content">
            <!--  사이드바 -->
            <th:block th:replace="~{/layout/fragments :: intro-sidebar}"></th:block>
        
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="content-1 text-left mt-5">
                    <h1><strong>[ENUM 캠핑장 소개]</strong></h1>
                </div>
                <section class="facility-section">
                    <div class="slider-container">
                        <div class="slider">
                            <input type="radio" name="slide" id="slide1" checked>
                            <input type="radio" name="slide" id="slide2">
                            <input type="radio" name="slide" id="slide3">
                            <ul class="imgs">
                                <li><img src="https://cdn.pixabay.com/photo/2020/08/21/15/04/tent-5506381_1280.jpg" alt="Image 1"></li>
                                <li><img src="https://cdn.pixabay.com/photo/2017/08/06/02/32/camp-2587926_1280.jpg" alt="Image 2"></li>
                                <li><img src="https://cdn.pixabay.com/photo/2017/08/07/18/28/night-2606510_1280.jpg" alt="Image 3"></li>
                            </ul>
                            <div class="bullets">
                                <label for="slide1"></label>
                                <label for="slide2"></label>
                                <label for="slide3"></label>
                            </div>
                        </div>
                    </div>
                </section>
                <section>
                    <div class="container">
                        <div class="box box1">
                            <h4>1. 자연친화적</h4>
                            <h5>ENUM 캠핑장은 자연친화적 공간으로 일상으로부터 벗어나 온전한 휴식을 즐기실 수 있습니다.</h5>
                        </div>
                        <div class="box box2">
                            <h4>2. 전 구역 데크존</h4>
                            <h5>모든 구역이 데크존으로 이루어져 있어 편리하고, 프라이빗하게 자연을 즐기실 수 있습니다.</h5>
                        </div>
                        <div class="box box3">
                            <h4>3. 다양한 편의 시설</h4>
                            <h5>화장실, 샤워실, 식수대, 주차장 뿐만 아니라 자체 매점 운영 및 무료 수영장 운영으로 합리적인 가격에 다양한 시설을 이용하실 수 있습니다.</h5>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <!-- 푸터 -->
        <th:block th:replace="~{/layout/fragments :: footer}"></th:block>
    </div>

    <!-- 부트 스트랩 JS -->
    <th:block th:replace="~{/layout/fragments :: bootstrapJS}"></th:block>
    <!-- Weather JS -->
    <th:block th:replace="~{/layout/fragments :: weatherJS}"></th:block>
</body>
</html>
