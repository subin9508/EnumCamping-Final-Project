spring.application.name=enumcamping
server.servlet.context-path=/enumcamping


# DataSource 관련 설정:
#mysql 연결
spring.datasource.url=jdbc:mysql://enumcamping.cf0acykuw6u3.ap-northeast-2.rds.amazonaws.com:3306/enumcamping?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=itwillenum
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate에서 DDL(create, drop, truncate, alter) 자동 실행 여부
spring.jpa.hibernate.ddl-auto=none

# JPA/Hibernate에서 작성된 SQL 문장을 로그로 출력할 때 보기좋게 포맷팅.
spring.jpa.properties.hibernate.format_sql=true
# JPA/Hibernate에서 작성된 SQL 문장을 로그로 출력할 때 highlight(글자색).
spring.jpa.properties.hibernate.highlight_sql=true

# 로그 레벨(trace < debug < info < warn < error < fatal)
# Hibernate에서 작성된 SQL 문장을 출력하기 위한 로그 레벨
logging.level.org.hibernate.SQL=DEBUG
# Hibernate에서 작성된 PreparedStatement의 바인딩 파라미터를 출력하기 위한 로그 레벨
logging.level.org.hibernate.orm.jdbc.bind=trace

logging.level.com.itwill.finalproject.web=DEBUG

logging.level.org.springframework.security=DEBUG